
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VR Duel Arena — Prototype 0.2</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<style>
body{margin:0}
#help{position:fixed;top:12px;left:12px;z-index:5;color:white;background:#071425d9;padding:12px 16px;border:1px solid #46d9ff;border-radius:10px;font:14px system-ui;max-width:310px;pointer-events:none}
#help b{color:#74e9ff}
</style>
</head>
<body>
<div id="help">
<b>VR DUEL ARENA · 0.2</b>
<div>Desktop: drag to look, WASD to move, click the glowing card.</div>
<div>Quest 3: enter VR. Duel Disk follows left controller. Aim and trigger with right controller to summon or reset.</div>
<div id="status">Ready to summon.</div>
</div>

<a-scene background="color:#071225"
 renderer="antialias:true; colorManagement:true"
 xr-mode-ui="enabled:true"
 shadow="type:pcfsoft">

<a-assets></a-assets>
<a-entity light="type:ambient;intensity:0.55;color:#a9d7ff"></a-entity>
<a-entity light="type:directional;intensity:1;castShadow:true"
 position="-2 8 4"></a-entity>
<a-sky color="#071225"></a-sky>
<a-plane rotation="-90 0 0" width="60" height="60"
 color="#101d30" material="roughness:0.8"></a-plane>

<a-cylinder position="0 0.08 -2.5" radius="5" height="0.16"
 color="#0e3455" material="metalness:0.5;roughness:0.4"></a-cylinder>
<a-ring position="0 0.171 -2.5" rotation="-90 0 0"
 radius-inner="4.65" radius-outer="4.8" color="#25c9ff"
 material="emissive:#157ca4;emissiveIntensity:0.6;side:double"></a-ring>

<!-- Arena -->
<a-entity position="0 0 -2.5">
 <a-box width="3.9" height="0.18" depth="2.9"
  position="0 0.27 0" color="#132b48"
  material="metalness:0.4"></a-box>
 <a-text value="PLAYER FIELD" position="0 0.375 1.22"
  rotation="-90 0 0" align="center" width="2.2"
  color="#65dbff"></a-text>
 <a-text value="OPPONENT FIELD" position="0 0.375 -1.22"
  rotation="-90 0 0" align="center" width="2.2"
  color="#ff8e9d"></a-text>
</a-entity>
<a-entity id="zones"></a-entity>

<!-- Holographic monster -->
<a-entity id="monster" visible="false" position="0 0.6 -2.5">
 <a-cylinder radius="0.72" height="0.06" color="#38d9ff"
  material="emissive:#1db9ff;emissiveIntensity:0.7;opacity:0.8;transparent:true"></a-cylinder>
 <a-entity id="holo" position="0 0.2 0"
  animation="property:rotation;to:0 360 0;loop:true;dur:12000;easing:linear">
  <a-cone position="0 0.8 0" radius-bottom="0.36"
   radius-top="0.03" height="1.45" color="#56e3ff"
   material="wireframe:true;emissive:#28baf0;emissiveIntensity:0.7"></a-cone>
  <a-sphere position="0 1.65 0" radius="0.24" color="#83f0ff"
   material="emissive:#36d7ff;emissiveIntensity:0.6"></a-sphere>
  <a-box position="-0.47 0.95 0" width="0.8" height="0.12"
   depth="0.23" rotation="0 0 -25" color="#3fdfff"
   material="emissive:#1caad9;emissiveIntensity:0.7"></a-box>
  <a-box position="0.47 0.95 0" width="0.8" height="0.12"
   depth="0.23" rotation="0 0 25" color="#3fdfff"
   material="emissive:#1caad9;emissiveIntensity:0.7"></a-box>
 </a-entity>
 <a-text value="TEST HOLOGRAM  |  ATK 1500"
  position="0 2.35 0" align="center" width="4"
  color="#7ae9ff"></a-text>
</a-entity>

<a-entity position="0 1.9 -5.9">
 <a-text value="VR DUEL ARENA" align="center"
  width="7" color="#69e9ff"></a-text>
 <a-text value="PROTOTYPE 0.2" position="0 -0.36 0"
  align="center" width="3.5" color="#b7d5e9"></a-text>
</a-entity>

<!-- Player and controllers -->
<a-entity id="rig" position="0 0 2">
 <a-entity id="camera" camera look-controls wasd-controls
  position="0 1.65 0">
  <a-entity cursor="rayOrigin:mouse"
   raycaster="objects:.clickable"></a-entity>
 </a-entity>

 <!-- LEFT ARM DUEL DISK -->
 <a-entity id="leftHand" laser-controls="hand:left"
  raycaster="objects:.clickable;far:8"
  line="color:#4dd9ff">

  <a-entity position="0.08 0.02 -0.22" rotation="-20 0 0">

   <!-- Main Duel Disk body -->
   <a-box width="0.28" height="0.09" depth="0.42"
    color="#24364d" material="metalness:0.7"></a-box>

   <!-- Extended blade -->
   <a-box width="0.85" height="0.035" depth="0.22"
    position="0.34 0 -0.12" color="#aab8ca"
    material="metalness:0.6"></a-box>

   <!-- Five Monster Zones -->
   <a-entity id="diskMonsterZones"
    position="0.34 0.025 -0.17"></a-entity>

   <!-- Five Spell and Trap Zones -->
   <a-entity id="diskSpellZones"
    position="0.34 0.025 -0.075"></a-entity>

   <!-- Life Points screen -->
   <a-box width="0.25" height="0.012" depth="0.13"
    position="0 0.055 0.03" color="#073d5e"
    material="emissive:#0077bb;emissiveIntensity:0.5"></a-box>

   <a-text value="LP 8000"
    position="0 0.065 0.03"
    rotation="-90 0 0"
    align="center" width="0.35"
    color="#7dffec"></a-text>

  </a-entity>
 </a-entity>

 <!-- RIGHT CONTROLLER -->
 <a-entity id="rightHand" laser-controls="hand:right"
  raycaster="objects:.clickable;far:12"
  line="color:#ffda72"></a-entity>
</a-entity>

<!-- Summon card -->
<a-entity id="card" class="clickable"
 position="-1 1.1 -1.2"
 geometry="primitive:box;width:0.45;height:0.66;depth:0.025"
 material="color:#6a3c83;emissive:#351e51;emissiveIntensity:0.4"
 animation="property:position;dir:alternate;dur:1300;loop:true;to:-1 1.2 -1.2">
 <a-text value="SUMMON" align="center" width="1.25"
  position="0 0.1 0.02" color="#ffffff"></a-text>
 <a-text value="TEST MONSTER" align="center" width="0.9"
  position="0 -0.11 0.02" color="#ffffff"></a-text>
</a-entity>

<!-- Reset button -->
<a-box id="reset" class="clickable" position="1 1.1 -1.2"
 width="0.7" height="0.25" depth="0.1" color="#8c2e50"
 material="emissive:#441326;emissiveIntensity:0.3">
 <a-text value="RESET" align="center" width="1.3"
  position="0 0 0.06" color="white"></a-text>
</a-box>
</a-scene>

<script>
// Build the Duel Disk slots.
function addDiskZones(parentId,color){
 const parent=document.querySelector(parentId);
 for(let i=0;i<5;i++){
  const slot=document.createElement('a-box');
  slot.setAttribute('position',`${(i-2)*0.155} 0 0`);
  slot.setAttribute('width','0.13');
  slot.setAttribute('height','0.008');
  slot.setAttribute('depth','0.065');
  slot.setAttribute('material',
   `color:${color};emissive:${color};emissiveIntensity:0.5`);
  parent.appendChild(slot);
 }
}
addDiskZones('#diskMonsterZones','#42ddff');
addDiskZones('#diskSpellZones','#ad74ff');

// Build the arena zones.
const zones=document.querySelector('#zones');
function zone(x,z,color){
 const el=document.createElement('a-box');
 el.setAttribute('position',`${x} 0.395 ${z}`);
 el.setAttribute('width','0.55');
 el.setAttribute('height','0.012');
 el.setAttribute('depth','0.72');
 el.setAttribute('material',
  `color:${color};emissive:${color};emissiveIntensity:0.28;opacity:0.8;transparent:true`);
 zones.appendChild(el);
}
for(let i=0;i<5;i++){
 let x=(i-2)*0.69;
 zone(x,-1.95,'#36caff');
 zone(x,-1.08,'#2680c4');
 zone(x,-3.05,'#e36e88');
 zone(x,-3.91,'#9b435c');
}

// Summon and reset interactions.
const monster=document.querySelector('#monster');
const status=document.querySelector('#status');

document.querySelector('#card').addEventListener('click',()=>{
 monster.setAttribute('visible',true);
 status.textContent='Test hologram summoned!';
});
document.querySelector('#reset').addEventListener('click',()=>{
 monster.setAttribute('visible',false);
 status.textContent='Ready to summon.';
});
</script>
</body>
</html>
