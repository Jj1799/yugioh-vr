
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yu-Gi-Oh! VR Duel Arena 0.3</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<style>
body{margin:0}
#help{position:fixed;top:12px;left:12px;z-index:5;color:white;background:#071425d9;padding:12px 16px;border:1px solid #46d9ff;border-radius:10px;font:14px system-ui;max-width:310px;pointer-events:none}
#help b{color:#74e9ff}
</style>
</head>
<body>
<div id="help">
<b>VR DUEL ARENA · 0.3</b>
<div>Desktop: drag to look, WASD to move, click objects.</div>
<div>Quest 3: use your right controller trigger to choose a Duel Disk or summon a monster.</div>
<div id="status">Ready to duel.</div>
</div>

<a-scene background="color:#071225"
 renderer="antialias:true;colorManagement:true"
 xr-mode-ui="enabled:true">

<a-entity light="type:ambient;intensity:0.65;color:#a9d7ff"></a-entity>
<a-entity light="type:directional;intensity:1" position="-2 8 4"></a-entity>
<a-sky color="#071225"></a-sky>
<a-plane rotation="-90 0 0" width="60" height="60" color="#101d30"></a-plane>
<a-cylinder position="0 0.08 -2.5" radius="5" height="0.16" color="#0e3455"></a-cylinder>
<a-ring position="0 0.171 -2.5" rotation="-90 0 0"
 radius-inner="4.65" radius-outer="4.8" color="#25c9ff"
 material="emissive:#157ca4;emissiveIntensity:0.6;side:double"></a-ring>

<!-- Duel field -->
<a-entity position="0 0 -2.5">
 <a-box width="3.9" height="0.18" depth="2.9"
  position="0 0.27 0" color="#132b48"></a-box>
 <a-text value="PLAYER FIELD" position="0 0.375 1.22"
  rotation="-90 0 0" align="center" width="2.2"
  color="#65dbff"></a-text>
 <a-text value="OPPONENT FIELD" position="0 0.375 -1.22"
  rotation="-90 0 0" align="center" width="2.2"
  color="#ff8e9d"></a-text>
</a-entity>
<a-entity id="zones"></a-entity>

<!-- Test hologram -->
<a-entity id="monster" visible="false" position="0 0.6 -2.5">
 <a-cylinder radius="0.72" height="0.06" color="#38d9ff"
  material="emissive:#1db9ff;emissiveIntensity:0.7"></a-cylinder>
 <a-entity position="0 0.2 0"
  animation="property:rotation;to:0 360 0;loop:true;dur:12000;easing:linear">
  <a-cone position="0 0.8 0" radius-bottom="0.36"
   radius-top="0.03" height="1.45" color="#56e3ff"
   material="wireframe:true;emissive:#28baf0;emissiveIntensity:0.7"></a-cone>
  <a-sphere position="0 1.65 0" radius="0.24" color="#83f0ff"
   material="emissive:#36d7ff;emissiveIntensity:0.6"></a-sphere>
  <a-box position="-0.47 0.95 0" width="0.8"
   height="0.12" depth="0.23" rotation="0 0 -25"
   color="#3fdfff"></a-box>
  <a-box position="0.47 0.95 0" width="0.8"
   height="0.12" depth="0.23" rotation="0 0 25"
   color="#3fdfff"></a-box>
 </a-entity>
 <a-text value="TEST HOLOGRAM | ATK 1500"
  position="0 2.35 0" align="center" width="4"
  color="#7ae9ff"></a-text>
</a-entity>

<a-entity position="0 1.9 -5.9">
 <a-text value="VR DUEL ARENA" align="center"
  width="7" color="#69e9ff"></a-text>
 <a-text value="PROTOTYPE 0.3" position="0 -0.36 0"
  align="center" width="3.5" color="#b7d5e9"></a-text>
</a-entity>

<!-- Player -->
<a-entity id="rig" position="0 0 2">
 <a-entity id="camera" camera look-controls wasd-controls
  position="0 1.65 0">
  <a-entity cursor="rayOrigin:mouse"
   raycaster="objects:.clickable"></a-entity>
 </a-entity>

 <a-entity id="leftHand" laser-controls="hand:left">
  <a-entity id="duelDisk" position="0.07 0.02 -0.23"
   rotation="-20 0 0"></a-entity>
 </a-entity>

 <a-entity id="rightHand" laser-controls="hand:right"
  raycaster="objects:.clickable;far:12"
  line="color:#ffda72"></a-entity>
</a-entity>

<!-- Selection menu -->
<a-entity id="diskMenu" position="-2.25 1.65 -1.9"
 rotation="0 18 0">
 <a-plane width="1.65" height="2.18" color="#0a213a"
  material="opacity:0.93;transparent:true;side:double"></a-plane>
 <a-text value="CHOOSE DUEL DISK"
  position="0 0.91 0.02" align="center"
  width="1.7" color="#7aeaff"></a-text>
 <a-text value="ALL DESIGNS UNLOCKED"
  position="0 0.73 0.02" align="center"
  width="1.45" color="#b5d3eb"></a-text>
 <a-entity id="diskChoices"></a-entity>
 <a-text id="chosenLabel" value="Equipped: Classic"
  position="0 -0.87 0.02" align="center"
  width="1.55" color="#8bffce"></a-text>
</a-entity>

<!-- Summon card -->
<a-entity id="card" class="clickable"
 position="-1 1.1 -1.2"
 geometry="primitive:box;width:0.45;height:0.66;depth:0.025"
 material="color:#6a3c83;emissive:#351e51;emissiveIntensity:0.4"
 animation="property:position;dir:alternate;dur:1300;loop:true;to:-1 1.2 -1.2">
 <a-text value="SUMMON" align="center" width="1.25"
  position="0 0.1 0.02" color="white"></a-text>
 <a-text value="TEST MONSTER" align="center" width="0.9"
  position="0 -0.11 0.02" color="white"></a-text>
</a-entity>

<a-box id="reset" class="clickable"
 position="1 1.1 -1.2" width="0.7" height="0.25"
 depth="0.1" color="#8c2e50">
 <a-text value="RESET" align="center" width="1.3"
  position="0 0 0.06" color="white"></a-text>
</a-box>
</a-scene>

<script>
const designs=[
 {name:'Classic',base:'#cbd4d8',trim:'#d32639',slot:'#48b9f5',shape:'classic'},
 {name:'GX White',base:'#f0f2f8',trim:'#aab8d1',slot:'#a4e4ed',shape:'gx'},
 {name:'GX Red',base:'#f0f2f8',trim:'#e43842',slot:'#a4e4ed',shape:'gx'},
 {name:'GX Blue',base:'#f0f2f8',trim:'#245bdf',slot:'#a4e4ed',shape:'gx'},
 {name:'GX Yellow',base:'#f0f2f8',trim:'#f2b51f',slot:'#a4e4ed',shape:'gx'},
 {name:'Crimson',base:'#a82730',trim:'#e46b5e',slot:'#333d6a',shape:'angular'},
 {name:'Future',base:'#e7d2a2',trim:'#ffbd18',slot:'#27394b',shape:'future'},
 {name:'Advanced',base:'#e2eaf4',trim:'#187be8',slot:'#394b61',shape:'advanced'}
];

function part(parent,tag,attrs){
 const el=document.createElement(tag);
 Object.entries(attrs).forEach(([key,value])=>{
  el.setAttribute(key,value);
 });
 parent.appendChild(el);
 return el;
}

const disk=document.querySelector('#duelDisk');

function equipDisk(index){
 const d=designs[index];
 disk.replaceChildren();

 const shell=part(disk,'a-entity',{});

 part(shell,'a-box',{
  position:'0 0 0',width:0.30,height:0.11,depth:0.40,
  color:d.base,material:'metalness:0.55;roughness:0.35'
 });

 part(shell,'a-cylinder',{
  position:'0 0.068 -0.08',
  radius:d.shape==='gx'?0.13:0.105,
  height:0.035,color:d.trim
 });

 part(shell,'a-cylinder',{
  position:'0 0.09 -0.08',
  radius:0.066,height:0.012,color:'#123e79',
  material:'emissive:#124b9b;emissiveIntensity:0.55'
 });

 const length=d.shape==='advanced'?0.60:
              d.shape==='future'?0.43:0.48;

 [-1,1].forEach(side=>{
  const angle=d.shape==='classic'?17:
              d.shape==='gx'?25:
              d.shape==='angular'?35:12;

  const wing=part(shell,'a-entity',{
   position:`${side*0.32} 0.015 -0.16`,
   rotation:`0 ${side*angle} 0`
  });

  part(wing,'a-box',{
   width:length,height:0.035,
   depth:d.shape==='future'?0.14:0.22,
   color:d.base,material:'metalness:0.4'
  });

  part(wing,'a-box',{
   position:'0 0.021 -0.09',
   width:length*0.96,height:0.008,
   depth:0.035,color:d.trim
  });

  const count=side===-1?2:3;
  for(let i=0;i<count;i++){
   const x=(i-(count-1)/2)*(length/count);
   part(wing,'a-box',{
    position:`${x} 0.024 0.012`,
    width:length/count-0.012,
    height:0.007,depth:0.13,
    color:d.slot,
    material:`emissive:${d.slot};emissiveIntensity:0.18`
   });
  }

  if(d.shape==='angular'||d.shape==='advanced'){
   part(wing,'a-cone',{
    position:`${side*length/2} 0.02 0`,
    rotation:`0 0 ${side*-90}`,
    radius:0.055,height:0.11,color:d.trim
   });
  }
 });

 part(shell,'a-box',{
  position:'0 0.073 0.09',
  width:0.25,height:0.012,depth:0.11,
  color:'#092e49',
  material:'emissive:#0768a0;emissiveIntensity:0.35'
 });

 part(shell,'a-text',{
  value:'LP 8000',
  position:'0 0.083 0.09',
  rotation:'-90 0 0',
  align:'center',width:0.30,color:'#9bffdf'
 });

 document.querySelector('#chosenLabel')
  .setAttribute('value','Equipped: '+d.name);

 document.querySelector('#status').textContent=
  'Equipped '+d.name+' Duel Disk.';

 document.querySelectorAll('.diskChoice').forEach((el,i)=>{
  el.setAttribute('color',
   i===index?'#196e75':'#1a3854');
 });
}

// Create all eight selection buttons
const choices=document.querySelector('#diskChoices');

designs.forEach((d,i)=>{
 const y=0.52-i*0.17;
 const button=part(choices,'a-box',{
  class:'clickable diskChoice',
  position:`0 ${y} 0.035`,
  width:1.43,height:0.145,depth:0.035,
  color:'#1a3854'
 });

 part(button,'a-box',{
  position:'-0.59 0 0.022',
  width:0.11,height:0.09,depth:0.01,
  color:d.trim
 });

 part(button,'a-text',{
  value:d.name,
  position:'0.05 0 0.025',
  align:'center',width:1.35,color:'#ffffff'
 });

 button.addEventListener('click',()=>equipDisk(i));
});

equipDisk(0);

// Arena card zones
const zones=document.querySelector('#zones');

function zone(x,z,color){
 const el=document.createElement('a-box');
 el.setAttribute('position',`${x} 0.395 ${z}`);
 el.setAttribute('width','0.55');
 el.setAttribute('height','0.012');
 el.setAttribute('depth','0.72');
 el.setAttribute('material',
  `color:${color};emissive:${color};emissiveIntensity:0.28;opacity:0.8;transparent:true`);
 zones.appendChild(el);
}

for(let i=0;i<5;i++){
 const x=(i-2)*0.69;
 zone(x,-1.95,'#36caff');
 zone(x,-1.08,'#2680c4');
 zone(x,-3.05,'#e36e88');
 zone(x,-3.91,'#9b435c');
}

// Test monster controls
const monster=document.querySelector('#monster');
const status=document.querySelector('#status');

document.querySelector('#card').addEventListener('click',()=>{
 monster.setAttribute('visible',true);
 status.textContent='Test hologram summoned!';
});

document.querySelector('#reset').addEventListener('click',()=>{
 monster.setAttribute('visible',false);
 status.textContent='Ready to summon.';
});
</script>
</body>
</html>
